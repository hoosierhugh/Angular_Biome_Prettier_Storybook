<div class="app-shell min-vh-100">
  <nav class="app-nav bg-white">
    <div class="app-container app-nav-bar mx-auto d-flex align-items-center gap-2 px-3">
      <span class="app-brand me-3 fw-bold">{{ title() }}</span>
      <a
        class="app-nav-link rounded py-2 fw-medium text-decoration-none"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a
        class="app-nav-link rounded py-2 fw-medium text-decoration-none"
        routerLink="/cart"
        routerLinkActive="active"
        >Cart</a
      >
      <a
        class="app-nav-link rounded py-2 fw-medium text-decoration-none"
        routerLink="/user"
        routerLinkActive="active"
        >User</a
      >
    </div>
  </nav>

  <main class="app-container app-main mx-auto px-3">
    <router-outlet />
  </main>
</div>
