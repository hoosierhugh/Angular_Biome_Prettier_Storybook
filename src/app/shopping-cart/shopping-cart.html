<div class="app-card app-cart mx-auto bg-white p-4 text-center">
  <h3 class="app-cart-title mb-0 fw-semibold">Shopping Cart Item</h3>

  <!-- Display the current state -->
  <div class="app-cart-quantity my-3">
    Quantity: <strong>{{ quantity() }}</strong>
  </div>

  <!-- Feedback Message: Changes color and text based on state -->
  <p [class]="isFull() ? 'app-status-full fw-bold mb-0' : 'app-status-available fw-bold mb-0'">
    {{ isFull() ? 'Maximum stock reached (10)!' : 'Items available to add.' }}
  </p>

  <div class="app-cart-actions mt-3 d-flex justify-content-center">
    <!-- Disabled when quantity is 0 -->
    <button
      aria-label="remove-item-button"
      class="app-btn app-btn-secondary rounded px-3 py-2 fw-medium"
      (click)="decrease()"
      [disabled]="quantity() === 0"
    >
      - Remove
    </button>

    <!-- Disabled when quantity is 10 -->
    <button
      aria-label="remove-item-button"
      class="app-btn app-btn-primary rounded px-3 py-2 fw-medium"
      (click)="increase()"
      [disabled]="isFull()"
    >
      + Add Item
    </button>
  </div>
</div>
