<section class="app-card bg-white">
  <h1 class="app-profile-title mb-0 fw-bold">User Profile</h1>

  @if (user(); as user) {
    <app-profile-photo [photoUrl]="user.picture.large" />
    <app-user-biography
      [fullName]="user.name.first + ' ' + user.name.last"
      [email]="user.email"
      [address]="user.location"
    />
  } @else {
    <p class="mb-0">Loading user profile...</p>
  }
</section>
